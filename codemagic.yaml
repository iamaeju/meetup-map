workflows:
  android-build:
    name: Android Build (까치 로컬 커뮤니티)
    max_build_duration: 60
    environment:
      node: 22
      java: 21
      vars:
        PACKAGE_NAME: "com.kkachi.app"
      groups:
        - app_config
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: |
          cat > .env << EOF
          VITE_KAKAO_MAP_KEY=$VITE_KAKAO_MAP_KEY
          VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
          VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET
          VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID
          VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
          EOF
          npm run build
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Build Android debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-build:
    name: iOS Build (까치 로컬 커뮤니티)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      vars:
        PACKAGE_NAME: "com.kkachi.app"
        BUNDLE_ID: "com.kkachi.app"
      groups:
        - app_config
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: |
          cat > .env << EOF
          VITE_KAKAO_MAP_KEY=$VITE_KAKAO_MAP_KEY
          VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
          VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET
          VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID
          VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
          EOF
          npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files (자동으로 인증서/프로파일 생성)
        script: |
          echo "$CERTIFICATE_PRIVATE_KEY_B64" | base64 --decode > /tmp/certificate_private_key.pem
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/certificate_private_key.pem \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          APP_RESOURCE_ID=$(app-store-connect apps --bundle-id "$BUNDLE_ID" --json | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['id'])")
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_RESOURCE_ID" --platform IOS || echo 0)
          cd ios/App
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
